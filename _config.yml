title: "Wei's Learning Notes"
author: "Wei Wu"
description: "Wei's learning notes." # This will show up in places like twitter, linkedin, etc, if you share your sites url as a post.

# Email / Social media user names used by the minima theme:
# All of these are optional and can be removed or commented out
email: "wwnigel@gmail.com"
#twitter_username: "twitteruser"
github_username: "wwucla"
linkedin_username: "weiwuucla"
#facebook_username: username
#flickr_username: username
#instagram_username: username
#pinterest_username: username
#youtube_username: username
#googleplus_username: +username

#########################################################################################
######### Nothing below needs to be changed (unless you know what you're doing) #########
#########################################################################################
theme: "minima"

rss: rss

# Minima doesn't use the 'mermaid: enable' key, 
# but we keep this so our logic in the post can see it
mermaid: true 

kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block_code_header: true
    
plugins:
  - jekyll-feed
  - jekyll-sitemap

# jekyll-titles-from-headings is auto-loaded by github-pages.
# We leave it at its defaults (collections: false) so it does NOT
# touch posts — front-matter `title:` stays authoritative even when
# a post starts with a heading.

defaults:
  - scope:
      path: ""
      type: post
    values:
      tags: Other

# Don't process internal-only files as Jekyll pages. Without this,
# top-level markdown like CLAUDE.md becomes /claude.html and minima
# auto-adds it to the header navigation.
exclude:
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .jekyll-cache
