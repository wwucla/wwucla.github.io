
<!-- Site build date: {{ "now" | date: "%FT%T%z" }} -->
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Begin SEO -->
  {% seo %}
  <!-- End SEO -->

  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  <link rel="stylesheet" type="text/css" href="/css/override.css">

  {% feed_meta %}

  {% if jekyll.environment == 'production' and site.google_analytics -%}
  <!-- Begin Google Analytics -->
  {% include google-analytics.html %}
  <!-- End Google Analytics -->
  {%- endif %}

  <!-- Begin highlight.js support -->
  <link rel="stylesheet" href="/js/highlightjs/styles/github.css">
  <link rel="stylesheet" href="/js/highlightjs/styles/ssms.css" />

  <script type="text/javascript" src="/js/highlightjs/highlight.min.js"></script>

  <script type="text/javascript" src="/js/highlightjs/languages/plaintext.min.js"></script>
  <script type="text/javascript" src="/js/highlightjs/languages/powershell.min.js"></script>
  <script type="text/javascript" src="/js/highlightjs/languages/tsql.min.js"></script>

  <script type="text/javascript">
    // Highlight all code blocks except mermaid — hljs escapes diagram syntax
    // which breaks mermaid.run() when it fires on the load event.
    document.addEventListener('DOMContentLoaded', function() {
      document.querySelectorAll('pre code:not(.language-mermaid)').forEach(function(block) {
        hljs.highlightElement(block);
      });
    });
  </script>

  {% if page.mermaid %}
  <!-- Preload mermaid so the browser fetches it in parallel with other resources -->
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs">
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({
      startOnLoad: false,
      theme: 'default',
      securityLevel: 'loose'
    });
    // DOMContentLoaded fires as soon as HTML is parsed — no need to wait
    // for images/fonts to load (which is what window 'load' waits for).
    document.addEventListener('DOMContentLoaded', () => {
      mermaid.run({ querySelector: '.language-mermaid' });
    });
  </script>
  {% endif %}
  
  <!-- end highlight.js support -->
</head>
